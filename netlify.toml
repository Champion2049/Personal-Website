[build]
  command = "npm run build"
  publish = "dist/public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

## API routes (must come BEFORE the SPA catch-all)
[[redirects]]
  from = "/api/guestbook"
  to = "/.netlify/functions/guestbook"
  status = 200

[[redirects]]
  from = "/api/spotify"
  to = "/.netlify/functions/spotify"
  status = 200

[[redirects]]
  from = "/api/spotify-stats"
  to = "/.netlify/functions/spotify-stats"
  status = 200

[[redirects]]
  from = "/api/mal-favorites"
  to = "/.netlify/functions/mal-favorites"
  status = 200

[[redirects]]
  from = "/api/mal-stats"
  to = "/.netlify/functions/mal-stats"
  status = 200

## SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
