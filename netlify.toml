[build]
  command = "npm run build"
  publish = "dist/public"

[dev]
  command = "npm run dev"
  targetPort = 8888

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

## API routes (must come BEFORE the SPA catch-all)
[[redirects]]
  from = "/api/guestbook"
  to = "/.netlify/functions/guestbook"
  status = 200

[[redirects]]
  from = "/api/spotify"
  to = "/.netlify/functions/spotify"
  status = 200

[[redirects]]
  from = "/api/spotify-stats"
  to = "/.netlify/functions/spotify-stats"
  status = 200

[[redirects]]
  from = "/api/spotify-login"
  to = "/.netlify/functions/spotify-login"
  status = 200

[[redirects]]
  from = "/api/spotify-callback"
  to = "/.netlify/functions/spotify-callback"
  status = 200

[[redirects]]
  from = "/api/mal"
  to = "/.netlify/functions/mal"
  status = 200

[[redirects]]
  from = "/api/mal-match"
  to = "/.netlify/functions/mal-match"
  status = 200

[[redirects]]
  from = "/api/steam"
  to = "/.netlify/functions/steam"
  status = 200

## SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
