[build]
  command = "npm run build"
  publish = "dist/public"

[dev]
  command = "npm run dev"
  targetPort = 8888

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

## API routes (must come BEFORE the SPA catch-all)
[[redirects]]
  from = "/api/guestbook"
  to = "/.netlify/functions/guestbook"
  status = 200

